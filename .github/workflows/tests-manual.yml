name: Tests

on:
  workflow_dispatch:
    inputs:
      frontend:
        description: Run frontend unit tests
        type: boolean
        default: true
      backend:
        description: Run backend tests
        type: boolean
        default: true
  pull_request:
    types: [labeled]

jobs:
  frontend-tests:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.frontend) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-tests')
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  backend-tests:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.backend) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-tests')
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_mysql
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --no-interaction
      - run: php artisan key:generate
      - run: composer run test
